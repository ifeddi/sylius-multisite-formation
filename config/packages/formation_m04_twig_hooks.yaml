# Formation M4 : Twig Hooks. On injecte le champ « Origine » dans l'onglet « Général »
# du formulaire produit (création et modification), sans copier aucun template du cœur.
# Les noms de hooks viennent de @SyliusAdmin (twig_hooks/product/create.yaml et update.yaml).
sylius_twig_hooks:
    hooks:
        'sylius_admin.product.create.content.form.sections.general':
            origin:
                template: 'admin/product/form/sections/general/origin.html.twig'
                priority: 50

        'sylius_admin.product.update.content.form.sections.general':
            origin:
                template: 'admin/product/form/sections/general/origin.html.twig'
                priority: 50
