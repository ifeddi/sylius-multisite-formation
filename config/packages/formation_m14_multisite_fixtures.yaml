                customer_group:
                    options:
                        custom:
                            retail:
                                code: 'retail'
                                name: 'Retail'
                            wholesale:
                                code: 'wholesale'
                                name: 'Wholesale (B2B)'

                # Clients : 7 particuliers (retail) et 3 acheteurs professionnels (groupe wholesale).
                shop_user:
                    name: 'shop_user'
                    options:
                        custom:
                            -   { email: 'shop@example.com', first_name: 'John', last_name: 'Doe', password: 'sylius', customer_group: 'retail' }
                            -   { email: 'marie.dupont@example.com', first_name: 'Marie', last_name: 'Dupont', password: 'sylius', customer_group: 'retail' }
                            -   { email: 'lucas.martin@example.com', first_name: 'Lucas', last_name: 'Martin', password: 'sylius', customer_group: 'retail' }
                            -   { email: 'hans.mueller@example.com', first_name: 'Hans', last_name: 'Müller', password: 'sylius', customer_group: 'retail' }
                            -   { email: 'anna.schmidt@example.com', first_name: 'Anna', last_name: 'Schmidt', password: 'sylius', customer_group: 'retail' }
                            -   { email: 'john.smith@example.com', first_name: 'John', last_name: 'Smith', password: 'sylius', customer_group: 'retail' }
                            -   { email: 'emily.johnson@example.com', first_name: 'Emily', last_name: 'Johnson', password: 'sylius', customer_group: 'retail' }
                            -   { email: 'buyer@wholesale.example.com', first_name: 'Claire', last_name: 'Acheteur', password: 'sylius', customer_group: 'wholesale' }
                            -   { email: 'bistro.gourmet@wholesale.example.com', first_name: 'Bistro', last_name: 'Gourmet', password: 'sylius', customer_group: 'wholesale' }
                            -   { email: 'hotel.alpes@wholesale.example.com', first_name: 'Hôtel', last_name: 'des Alpes', password: 'sylius', customer_group: 'wholesale' }

                admin_user:
                    name: 'admin_user'
                    options:
                        custom:
                            -   email: 'sylius@example.com'
                                username: 'sylius'
                                password: 'sylius'
                                enabled: true
                                locale_code: 'en_US'
                                first_name: 'John'
