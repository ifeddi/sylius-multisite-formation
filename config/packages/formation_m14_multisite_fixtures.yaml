# Formation M14 : instance multi-sites / multi-marchés pour le développement local, avec un jeu de données complet.
#
#   bin/console sylius:fixtures:load formation_multisite
#
# Sites (un channel par site, une seule base de code et une seule base de données) :
#   http://localhost              -> HQ       Portail global (EUR / USD, en_US + fr_FR + de_DE)
#   http://fr.sylius.localhost    -> SITE_FR  Marché France (EUR, fr_FR)
#   http://de.sylius.localhost    -> SITE_DE  Marché Allemagne (EUR, de_DE)
#   http://us.sylius.localhost    -> SITE_US  Marché États-Unis (USD, en_US)
#
# Jeu de données : 20 produits (6 catégories, 2 produits configurables avec variantes, attributs, images),
# noms et descriptions traduits en fr / de / en, origine et fournisseurs, 10 clients (retail et B2B),
# environ 30 commandes réparties sur les sites, 4 promotions de panier et 1 promotion de catalogue.
# Le produit « Maple Syrup » n'est vendu qu'aux États-Unis, l'huile d'olive pas aux États-Unis.
#
# Les identifiants des comptes de test (administrateur, API, clients) sont définis ci-dessous.
# Réservé au développement local : ne jamais charger de fixtures en production.
sylius_fixtures:
    suites:
        formation_multisite:
            listeners:
                orm_purger: ~
                images_purger: ~
                logger: ~
                catalog_promotion_processor_executor: ~

            fixtures:
                locale:
                    options:
                        locales: ['en_US', 'fr_FR', 'de_DE']

                currency:
                    options:
                        currencies: ['EUR', 'USD']

                geographical:
                    options:
                        countries: ['FR', 'DE', 'BE', 'US']
                        zones:
                            EU:
                                name: 'Union européenne'
                                countries: ['FR', 'DE', 'BE']
                            US:
                                name: 'États-Unis'
                                countries: ['US']

                menu_taxon:
                    name: taxon
                    options:
                        custom:
                            category:
                                code: 'category'
                                name: 'Category'
                                translations:
                                    en_US:
                                        name: 'Category'
                                    fr_FR:
                                        name: 'Catégorie'
                                    de_DE:
                                        name: 'Kategorie'

                channel:
                    options:
                        custom:
                            hq:
                                name: 'Portail global'
                                code: 'HQ'
                                hostname: 'localhost'
                                default_locale: 'en_US'
                                locales: ['en_US', 'fr_FR', 'de_DE']
                                base_currency: 'EUR'
                                currencies: ['EUR', 'USD']
                                default_tax_zone: 'EU'
                                enabled: true
                                menu_taxon: 'category'
                                contact_email: 'portail@example.com'
                                shop_billing_data:
                                    company: 'Portail global'
                                    tax_id: 'EU0000001'
                                    country_code: 'FR'
                                    street: '1 rue du Portail'
                                    city: 'Paris'
                                    postcode: '75001'
                            site_fr:
                                name: 'Site France'
                                code: 'SITE_FR'
                                hostname: 'fr.sylius.localhost'
                                default_locale: 'fr_FR'
                                locales: ['fr_FR']
                                base_currency: 'EUR'
                                currencies: ['EUR']
                                default_tax_zone: 'EU'
                                enabled: true
                                menu_taxon: 'category'
                                contact_email: 'france@example.com'
                                shop_billing_data:
                                    company: 'Site France'
                                    tax_id: 'FR0000002'
                                    country_code: 'FR'
                                    street: '2 avenue de France'
                                    city: 'Lyon'
                                    postcode: '69001'
                            site_de:
                                name: 'Site Deutschland'
                                code: 'SITE_DE'
                                hostname: 'de.sylius.localhost'
                                default_locale: 'de_DE'
                                locales: ['de_DE']
                                base_currency: 'EUR'
                                currencies: ['EUR']
                                default_tax_zone: 'EU'
                                enabled: true
                                menu_taxon: 'category'
                                contact_email: 'deutschland@example.com'
                                shop_billing_data:
                                    company: 'Site Deutschland'
                                    tax_id: 'DE0000003'
                                    country_code: 'DE'
                                    street: '3 Hauptstrasse'
                                    city: 'Berlin'
                                    postcode: '10115'
                            site_us:
                                name: 'Site United States'
                                code: 'SITE_US'
                                hostname: 'us.sylius.localhost'
                                default_locale: 'en_US'
                                locales: ['en_US']
                                base_currency: 'USD'
                                currencies: ['USD']
                                default_tax_zone: 'US'
                                enabled: true
                                menu_taxon: 'category'
                                contact_email: 'usa@example.com'
                                shop_billing_data:
                                    company: 'Site United States'
                                    tax_id: 'US0000004'
                                    country_code: 'US'
                                    street: '4 Main Street'
                                    city: 'New York'
                                    postcode: '10001'

                payment_method:
                    options:
                        custom:
                            cash_on_delivery:
                                code: 'cash_on_delivery'
                                name: 'Cash on delivery'
                                enabled: true
                                channels: ['HQ', 'SITE_FR', 'SITE_DE', 'SITE_US']
                            bank_transfer:
                                code: 'bank_transfer'
                                name: 'Bank transfer'
                                enabled: true
                                channels: ['HQ', 'SITE_FR', 'SITE_DE', 'SITE_US']

                shipping_method:
                    options:
                        custom:
                            eu_standard:
                                code: 'eu_standard'
                                name: 'Livraison standard Europe'
                                enabled: true
                                zone: 'EU'
                                channels: ['HQ', 'SITE_FR', 'SITE_DE']
                                calculator:
                                    type: 'flat_rate'
                                    configuration:
                                        HQ: { amount: 790 }
                                        SITE_FR: { amount: 590 }
                                        SITE_DE: { amount: 690 }
                            us_standard:
                                code: 'us_standard'
                                name: 'Standard shipping US'
                                enabled: true
                                zone: 'US'
                                channels: ['SITE_US']
                                calculator:
                                    type: 'flat_rate'
                                    configuration:
