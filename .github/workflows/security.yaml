# Contrôles de sécurité : secrets (code et historique), dépendances vulnérables.
name: Security

on:
    push:
        branches: [main]
    pull_request: ~
    schedule:
        - cron: '0 4 * * 1' # chaque lundi
    workflow_dispatch: ~

concurrency:
    group: security-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    secrets:
        name: Secrets (gitleaks)
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0 # tout l'historique

            -   uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    composer-audit:
        name: Dépendances (composer audit)
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.3'
                    tools: composer

            # composer.lock n'est pas versionné (convention de Sylius-Standard) : on résout les versions
            # actuellement installables, puis on audite. Les paquets abandonnés sont signalés sans faire échouer.
            -   run: composer update --no-install --no-scripts --no-interaction --ignore-platform-reqs

            -   run: composer audit --locked --abandoned=report

    dependency-review:
        name: Revue des dépendances (pull request)
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
