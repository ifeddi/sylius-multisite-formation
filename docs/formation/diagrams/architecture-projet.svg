<text x="54" y="128" font-size="17" font-weight="700" fill="#455A64" text-anchor="start" >Visiteurs (navigateur)</text>
<text x="54" y="154" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >HQ : localhost  ·  FR : fr.sylius.localhost</text>
<text x="54" y="175" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >DE : de.sylius.localhost  ·  US : us.sylius.localhost</text>
