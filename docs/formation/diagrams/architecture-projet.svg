<text x="1304" y="365" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >port 3306</text>
<text x="1304" y="386" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >files Messenger</text>
<text x="1304" y="407" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >root sans mot de passe (local)</text>
<rect x="1290" y="455" width="255" height="105" rx="12" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
<text x="1304" y="483" font-size="17" font-weight="700" fill="#455A64" text-anchor="start" >MailHog</text>
<text x="1304" y="509" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >SMTP 1025, interface 8025</text>
<text x="1304" y="530" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >capture tous les e-mails</text>
<rect x="1290" y="585" width="255" height="105" rx="12" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
