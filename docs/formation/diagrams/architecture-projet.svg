<text x="384" y="343" font-size="17" font-weight="700" fill="#1F4E9C" text-anchor="start" >Sylius Standard 2.3.1</text>
<text x="384" y="369" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Boutique (Twig)</text>
<text x="384" y="390" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Admin : Twig Hooks + Grid</text>
<text x="384" y="411" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >API Platform Shop et Admin (JWT)</text>
<text x="384" y="432" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Workflows : Symfony Workflow</text>
<text x="384" y="453" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Messenger (transport doctrine)</text>
<text x="384" y="474" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Channels : HQ, SITE_FR, SITE_DE, SITE_US</text>
<rect x="800" y="315" width="410" height="215" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="814" y="343" font-size="17" font-weight="700" fill="#2E7D32" text-anchor="start" >Code de formation (src/Formation)</text>
<text x="814" y="369" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >M02 Origin : champ origin du produit</text>
<text x="814" y="390" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >M03 Supplier : ressource fournisseur</text>
<text x="814" y="411" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >M04 Admin : grid, formulaire, menu</text>
<text x="814" y="432" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >M05 Workflow : listener de paiement</text>
<text x="814" y="453" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >M07 Catalog : fixtures</text>
<text x="814" y="474" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >M14 MultiSite : sites:list, sites:open</text>
<rect x="370" y="548" width="840" height="105" rx="12" fill="#E8F0FB" stroke="#1F4E9C" stroke-width="2"/>
<text x="384" y="576" font-size="17" font-weight="700" fill="#1F4E9C" text-anchor="start" >Modèle multi-sites</text>
<text x="384" y="602" font-size="14" font-weight="400" fill="#263238" text-anchor="start" >Un channel par site : prix par channel (ChannelPricing), orders liées à un channel</text>
<text x="384" y="623" font-size="14" font-weight="400" fill="#263238" text-anchor="start" >Customers et admins partagés entre les sites : une cliente inscrite en France se connecte partout</text>
<rect x="370" y="668" width="840" height="105" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
<text x="384" y="696" font-size="17" font-weight="700" fill="#E65100" text-anchor="start" >Qualité et outils</text>
<text x="384" y="722" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >ECS · PHPStan niveau 9 · PHPUnit (49 tests) · Rector</text>
<text x="384" y="743" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >scripts/formation : init, deploy, dump, restore, anonymize, qa</text>
<rect x="1290" y="290" width="255" height="140" rx="12" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
