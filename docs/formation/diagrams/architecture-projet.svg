<rect width="1600" height="1040" fill="#FFFFFF"/>
<text x="30" y="44" font-size="28" font-weight="700" fill="#17365D" text-anchor="start" >Architecture du projet : Sylius 2.3.1 multi-sites</text>
<text x="30" y="72" font-size="16" font-weight="400" fill="#546E7A" text-anchor="start" >Environnement local Docker : une base, un code, quatre sites (channels)</text>
