<text x="599" y="173" font-size="17" font-weight="700" fill="#2E7D32" text-anchor="start" >Formation QA</text>
<text x="599" y="199" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Ubuntu, PHP 8.3</text>
<text x="599" y="220" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >1  composer validate --strict</text>
