<text x="949" y="283" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >(.gitleaks.toml)</text>
<text x="949" y="304" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Actions épinglées par SHA</text>
<text x="949" y="325" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Lecture seule par défaut</text>
<rect x="1300" y="110" width="270" height="390" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
<text x="1314" y="138" font-size="17" font-weight="700" fill="#E65100" text-anchor="start" >Protection de main</text>
<text x="1314" y="164" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >PR obligatoire</text>
<text x="1314" y="185" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >1 approbation</text>
<text x="1314" y="206" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >3 contrôles requis :</text>
<text x="1314" y="227" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >  QA, gitleaks, audit</text>
<text x="1314" y="248" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Branche à jour</text>
<text x="1314" y="269" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Conversations résolues</text>
<text x="1314" y="290" font-size="15" font-weight="400" fill="#263238" text-anchor="start" >Historique linéaire</text>
