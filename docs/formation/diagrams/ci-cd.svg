<text x="44" y="428" font-size="14" font-weight="400" fill="#263238" text-anchor="start" >Security : chaque lundi à 04:00</text>
<rect x="565" y="520" width="1005" height="70" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="585" y="552" font-size="17" font-weight="700" fill="#2E7D32" text-anchor="start" >Fusion (squash ou rebase) dans main : source de vérité, branche supprimée ensuite</text>
<text x="585" y="575" font-size="14" font-weight="400" fill="#263238" text-anchor="start" >Aucun déploiement ne part automatiquement de main aujourd'hui.</text>
